name: Candidate artifacts and synthetic tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Checkout pinned core baseline
        uses: actions/checkout@v4
        with:
          repository: spectrochempy/spectrochempy
          ref: cdb087a24f06b8c83ea91ea036192304db9329e3
          path: baseline-core
      - name: Secure pip bootstrap
        uses: ./baseline-core/.github/actions/verified-pip
      - name: Build sdist and wheel from sdist
        run: |
          python -m pip install build twine pytest
          python -m build
          python -m twine check dist/*
      - name: Install candidate and pinned core artifacts
        run: |
          python -m pip wheel --no-deps --wheel-dir baseline-wheels ./baseline-core ./baseline-core/plugins/spectrochempy-hypercomplex
          python -m pip install baseline-wheels/*.whl dist/*.whl
          python -m pip check
      - name: Run synthetic tests against installed artifacts
        run: |
          python -I -m pytest -ra tests/test_linear_prediction.py tests/test_fft_encodings.py tests/test_fft_2d_characterization.py

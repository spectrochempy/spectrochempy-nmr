name: Build and publish NMR package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_to:
        description: "Optional TestPyPI publication"
        required: true
        default: none
        type: choice
        options: [none, testpypi]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DISTRIBUTION: spectrochempy-nmr
  RELEASE_PREFIX: spectrochempy-nmr-v

jobs:
  build:
    name: Build, validate and test artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pinned build tools
        run: |
          python -m pip install --quiet \
            "build==1.6.1" "twine==7.0.0" \
            "setuptools==84.2.1" "wheel==0.48.0" \
            pytest pytest-doctestplus
      - name: Validate release version
        if: ${{ github.event_name == 'release' }}
        run: |
          expected="${GITHUB_REF_NAME#${RELEASE_PREFIX}}"
          actual=$(python - <<'PY'
          import tomllib
          print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])
          PY
          )
          test "$expected" = "$actual" || {
            echo "::error::version mismatch: tag=$expected metadata=$actual"
            exit 1
          }
      - name: Build wheel and sdist
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m build --no-isolation --outdir dist
          python -m twine check dist/*
      - name: Install and test the built wheel
        run: |
          python -m pip install --quiet dist/*.whl
          python -m pip check
          python -I -m pytest -q
      - uses: actions/upload-artifact@v7
        with:
          name: nmr-release-dist
          path: dist/*
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to == 'testpypi' }}
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nmr-release-dist
          path: dist
      - name: Publish immutable artifacts to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: false

  publish-pypi:
    name: Publish to PyPI
    if: >-
      github.event_name == 'release' && github.event.action == 'published' &&
      startsWith(github.ref_name, env.RELEASE_PREFIX)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nmr-release-dist
          path: dist
      - name: Publish immutable artifacts to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: false

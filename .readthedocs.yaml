# Read the Docs Community preproduction configuration for standalone NMR docs.
# This project is intentionally independent from the core RTD project.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs/conf.py
  builder: html
  fail_on_warning: true

python:
  install:
    # Pin the external runtime/documentation environment first. The NMR
    # package itself is installed from the checkout by the next entry.
    - requirements: docs/requirements-rtd.txt
    - method: pip
      path: .

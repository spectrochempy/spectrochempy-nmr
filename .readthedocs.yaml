# Read the Docs Community preproduction configuration for standalone NMR docs.
# This project is intentionally independent from the core RTD project.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    pre_build:
      - python docs/fetch_gallery_data.py
    build:
      html:
        # Sphinx's default RTD command adds ``-j auto``. The gallery examples
        # share plugin metadata state, so serialize this build to avoid a
        # reproducible relaxation-example race in Sphinx-Gallery.
        - python -m sphinx -T -W --keep-going -b html -d _build/doctrees docs $READTHEDOCS_OUTPUT/html

sphinx:
  configuration: docs/conf.py
  builder: html
  fail_on_warning: true

python:
  install:
    # Pin the external runtime/documentation environment first. The NMR
    # package itself is installed from the checkout by the next entry.
    - requirements: docs/requirements-rtd.txt
    - method: pip
      path: .
